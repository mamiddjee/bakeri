<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click Text</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #121212;
      font-family: Arial, sans-serif;
    }button {
  padding: 20px 30px;
  font-size: 22px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: #1db954;
  color: white;
}

#text {
  margin-top: 20px;
  font-size: 28px;
  color: white;
  display: none;
  text-align: center;
}

.container {
  text-align: center;
}

  </style>
</head>
<body>
  <div class="container">
    <button onclick="showText()">Tekan Aku</button>
    <div id="text">bakri kontol</div>
  </div>  <script>
    function showText() {
      const text = document.getElementById('text');
      text.style.display = 'block';
    }
  </script></body>
</html>
